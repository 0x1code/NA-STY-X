<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAXI — анимация логотипа</title>
<style>*{box-sizing:border-box}body{margin:0;background:#151718;color:#f8f7f5;font:15px system-ui}main{max-width:760px;margin:24px auto;padding:0 20px}h1{font-size:18px;letter-spacing:.2em;font-weight:500}#player{width:100%;aspect-ratio:1;background:#202222;border-radius:20px}nav{display:flex;gap:12px;align-items:center;margin:16px 0;flex-wrap:wrap}button,select{font:inherit;color:inherit;background:#282d2d;border:1px solid #414747;border-radius:9px;padding:10px 14px;cursor:pointer}input{flex:1;accent-color:#57f4b4;min-width:160px}small{color:#9aa6a2}#player.light{background:#87958f}</style>
<body><main><h1>NAXI / MOTION</h1><div id="player"></div><nav><button id="replay">Повторить</button><button id="pause">Пауза</button><select id="mode"><option value="intro">Появление · 6,17 с</option><option value="idle">Ожидание · 2,4 с</option></select><button id="background">Фон</button><input id="seek" type="range" min="0" max="369" value="0" aria-label="Кадр анимации"></nav><small>60 кадров/с · векторные контуры · прозрачный фон</small></main><script src="assets/lottie.min.js"></script><script src="assets/intro-data.js"></script><script src="assets/idle-data.js"></script>
<script>let animation;const player=document.getElementById('player'),seek=document.getElementById('seek'),pause=document.getElementById('pause');function load(){if(animation)animation.destroy();const idle=document.getElementById('mode').value==='idle';seek.max=idle?143:369;animation=lottie.loadAnimation({container:player,renderer:'svg',loop:idle,autoplay:true,animationData:JSON.parse(JSON.stringify(idle?window.NAXI_IDLE:window.NAXI_ANIMATION))});animation.addEventListener('enterFrame',()=>seek.value=Math.round(animation.currentFrame));pause.textContent='Пауза'}load();document.getElementById('mode').onchange=load;document.getElementById('replay').onclick=()=>{animation.goToAndPlay(0,true);pause.textContent='Пауза'};pause.onclick=()=>{animation.togglePause();pause.textContent=animation.isPaused?'Продолжить':'Пауза'};seek.oninput=()=>{animation.goToAndStop(+seek.value,true);pause.textContent='Продолжить'};document.getElementById('background').onclick=()=>player.classList.toggle('light');</script></body></html>
