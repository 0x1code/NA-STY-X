name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.74.0
      - run: cargo test --workspace --locked

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python research/generate_vectors.py --check
      - run: python research/generate_v3_vectors.py --check
      - run: python research/generate_session_vectors.py --check
      - run: python research/generate_sbox_circuit.py --check
      - run: python research/construction_analysis.py --samples 2 --bases 1 --cases 2 --output construction-smoke.json
      - run: python demos/e2ee_chat.py
      - run: python research/sbox_design.py --check
      - run: python research/lab.py --samples 2 --seed 20261011 --output lab-smoke.json
