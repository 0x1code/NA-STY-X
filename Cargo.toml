[workspace]
members = ["crates/nastyx-core", "crates/nastyx-cli", "crates/nastyx-engine", "crates/nastyx-message", "crates/nastyx-session"]
resolver = "2"

[workspace.dependencies]
# Memory erasure only; no encryption, authentication or key agreement from dependencies.
zeroize = { version = "=1.8.2", default-features = false }

[workspace.package]
version = "0.2.0-alpha"
edition = "2021"
license = "MIT"
rust-version = "1.74"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Fixed-operation Boolean substitution is costly without optimization. Test
# assertions and overflow checks remain enabled; only optimization is changed.
[profile.test]
opt-level = 1
